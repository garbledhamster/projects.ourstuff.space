            <section class="console-empty">
              <h3>${module.icon} ${module.name} dashboard coming soon</h3>
              <p>${escapeHtml(module.desc)}</p>
            </section>

            <section class="integration-panel">
              <div>
                <h3>Layer 2 visibility</h3>
                <p>${escapeHtml(module.visibleData)}</p>
              </div>
              <div>
                <h3>Layer 3 selected actions</h3>
                <p>${escapeHtml(module.controlledActions)}</p>
              </div>
            </section>
          </section>
        `;
      };

      const renderModulePanel = (project, moduleId) => {
        const module = getModuleDefinitions().find((item) => item.id === moduleId);
        if (!module || !project.modules?.[module.id]?.enabled) {
          state.projectTab = "overview";
          return renderOverviewPanel(project);
        }
        return renderComingSoonModulePanel(project, module);
      };

      const renderAccessPanel = (project) => {
        const access = normalizeAccess(project.access, "project");

        return `
          <section id="panel-access" class="tab-panel" role="tabpanel" aria-labelledby="tab-access">
            <section class="section" aria-labelledby="projectAccessHeading">
              <div class="section-head">
                <div>
                  <h3 id="projectAccessHeading">🔐 Project access</h3>
                  <p class="section-subtle">Least-privilege structure starts here: app access, project access, phase access, then task assignment.</p>
                </div>
              </div>

              <form class="form-grid" data-action="save-project-access" data-project-id="${project.id}">
                <div class="field">
                  <label for="projectVisibility">Project visibility</label>
                  <select id="projectVisibility" class="select" name="visibility">
                    <option value="private" ${access.visibility === "private" ? "selected" : ""}>Private</option>
                    <option value="project" ${access.visibility === "project" ? "selected" : ""}>Project members</option>
                    <option value="assigned" ${access.visibility === "assigned" ? "selected" : ""}>Assigned users only</option>
                    <option value="public" ${access.visibility === "public" ? "selected" : ""}>Visible to dashboard users</option>
                  </select>
                </div>
                <div class="field">
                  <label for="projectOwners">Project owners</label>
                  <input id="projectOwners" class="input" name="owners" type="text" value="${escapeHtml(access.owners)}" placeholder="Names or emails, comma-separated" />
                </div>
                <div class="field full">
                  <label for="projectMembers">Project members</label>
                  <input id="projectMembers" class="input" name="members" type="text" value="${escapeHtml(access.members)}" placeholder="Names or emails, comma-separated" />
                </div>
                <div class="field full">
                  <button class="button primary" type="submit">💾 Save project access</button>
                  <span class="save-state" role="status">${escapeHtml(state.saveStatus)}</span>
                </div>
              </form>
            </section>

            <section class="section" aria-labelledby="phaseAccessHeading">
              <div class="section-head">
                <div>
                  <h3 id="phaseAccessHeading">🧩 Phase access</h3>
                  <p class="section-subtle">Phases can inherit project visibility or be narrowed further.</p>
                </div>
              </div>

              ${project.phases.length === 0 ? `
                <div class="console-empty">
                  <h3>No phases yet</h3>
                  <p>Add phases before assigning phase-level visibility.</p>
                </div>
              ` : `
                <div class="access-grid">
                  ${project.phases.map((phase) => {
                    const phaseAccess = normalizeAccess(phase.access, "project");
                    return `
                      <form class="access-row" data-action="save-phase-access" data-project-id="${project.id}" data-phase-id="${phase.id}">
                        <div>
                          <strong>${escapeHtml(phase.name)}</strong>
                          <span>Visibility controls for this project phase.</span>
                        </div>
                        <div class="field">
                          <label class="sr-only" for="phaseVisibility-${phase.id}">Phase visibility</label>
                          <select id="phaseVisibility-${phase.id}" class="select" name="visibility">
                            <option value="project" ${phaseAccess.visibility === "project" ? "selected" : ""}>Project members</option>
                            <option value="assigned" ${phaseAccess.visibility === "assigned" ? "selected" : ""}>Assigned only</option>
                            <option value="private" ${phaseAccess.visibility === "private" ? "selected" : ""}>Owners only</option>
                          </select>
                          <label class="sr-only" for="phaseAssignee-${phase.id}">Phase owner</label>
                          <input id="phaseAssignee-${phase.id}" class="input" name="assignee" type="text" value="${escapeHtml(phaseAccess.assignee)}" placeholder="Phase owner" />
                          <button class="button secondary small" type="submit">Save</button>
                        </div>
                      </form>
                    `;
                  }).join("")}
                </div>
              `}
            </section>

            <section class="section" aria-labelledby="taskAccessHeading">
              <div class="section-head">
                <div>
                  <h3 id="taskAccessHeading">☑️ Task assignment</h3>
                  <p class="section-subtle">Task assignment is the narrowest layer. Keep this scoped to the people doing the work.</p>
                </div>
              </div>

              ${project.tasks.length === 0 ? `
                <div class="console-empty">
                  <h3>No tasks yet</h3>
                  <p>Add tasks before assigning task visibility or owners.</p>
                </div>
              ` : `
                <div class="access-grid">
                  ${project.tasks.map((task) => {
                    const taskAccess = normalizeAccess(task.access, "phase");
                    return `
                      <form class="access-row" data-action="save-task-access" data-project-id="${project.id}" data-task-id="${task.id}">
                        <div>
                          <strong>${escapeHtml(task.title)}</strong>
                          <span>Phase: ${escapeHtml(phaseLabel(project, task.phaseId))}</span>
                        </div>
                        <div class="field">
                          <label class="sr-only" for="taskVisibility-${task.id}">Task visibility</label>
                          <select id="taskVisibility-${task.id}" class="select" name="visibility">
                            <option value="phase" ${taskAccess.visibility === "phase" ? "selected" : ""}>Phase members</option>
                            <option value="assigned" ${taskAccess.visibility === "assigned" ? "selected" : ""}>Assigned only</option>
                            <option value="project" ${taskAccess.visibility === "project" ? "selected" : ""}>Project members</option>
                          </select>
                          <label class="sr-only" for="taskAssignee-${task.id}">Task assignee</label>
                          <input id="taskAssignee-${task.id}" class="input" name="assignee" type="text" value="${escapeHtml(taskAccess.assignee)}" placeholder="Task assignee" />
                          <button class="button secondary small" type="submit">Save</button>
                        </div>
                      </form>
                    `;
                  }).join("")}
                </div>
              `}
            </section>
          </section>
        `;
      };

      const renderActiveProjectPanel = (project) => {
        if (state.projectTab.startsWith("module:")) return renderModulePanel(project, state.projectTab.slice("module:".length));
        if (state.projectTab === "phases") return renderPhasesPanel(project);
        if (state.projectTab === "tasks") return renderTasksPanel(project);
        if (state.projectTab === "access") return renderAccessPanel(project);
        if (state.projectTab === "notes") return renderNotesPanel(project);
        return renderOverviewPanel(project);
      };

      const renderProjectConsole = () => {
        const project = getSelectedProject();

        if (!project) {
          renderAllProjectsTable();
          return;
        }

        els.workspacePanel.innerHTML = `
          <div class="detail-header">
            <div class="detail-title">
              <div class="detail-heading-line">
                ${renderProjectEmojiControl(project)}
                <h2 id="workspaceHeading">${escapeHtml(project.name)}</h2>
              </div>
              <p>${statusIcons[project.status]} ${statusLabels[project.status]} · ${stageIcons[project.stage]} ${stageLabels[project.stage]}${project.modules?.planner?.enabled ? " · 📋 Planner on" : ""}</p>
            </div>
            <div class="detail-actions">
              <span class="modules-anchor">
                <button class="button secondary" type="button" data-action="open-modules" data-project-id="${project.id}" aria-expanded="${state.modulesOpen}">🧩 Modules</button>
                ${state.modulesOpen ? renderModulesPopover(project) : ""}
              </span>
              <button class="button secondary" type="button" data-action="export-project" data-project-id="${project.id}">⬇️ Export</button>
              <button class="button danger" type="button" data-action="delete-project" data-project-id="${project.id}">🗑️ Delete</button>
            </div>
          </div>

          ${renderProjectNav(project)}

          <div class="detail-body">
            ${renderActiveProjectPanel(project)}
          </div>
        `;
      };

      const openProjectDialog = () => {
        els.projectForm.reset();
        els.createProjectButton.disabled = true;
        els.projectDialog.showModal();
        window.requestAnimationFrame(() => els.newProjectName.focus());
      };

      const closeProjectDialog = () => {
        els.projectDialog.close();
        els.openProjectDialogButton.focus();
      };

      const createProject = (formData) => {
        const name = String(formData.get("name") || "").trim();
        if (!name) return;

        const rawStage = String(formData.get("stage") || "planning");
        const stage = rawStage === "execution" ? "production" : rawStage;
        const firstPhase = makePhaseFromStage(stage, "active");

        const project = normalizeProject({
          name,
          status: formData.get("status"),
          stage,
          goal: formData.get("goal"),
          nextAction: formData.get("nextAction"),
          phases: [firstPhase],
          tasks: [],
          notes: [],
          integrations: normalizeIntegrations({}),
          modules: normalizeModules({}),
          createdAt: now(),
          updatedAt: now()
        });

        state.projects.unshift(project);
        state.selectedId = project.id;
        state.workspace = "project";
        state.projectTab = "overview";
        state.filter = "all";
        state.search = "";
        els.searchInput.value = "";
        persist("Project created");
        els.projectDialog.close();
      };

      const exportData = (data, filename) => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };

      const handleImport = async (file) => {
        if (!file) return;

        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const incoming = Array.isArray(parsed.projects)
            ? parsed.projects
            : Array.isArray(parsed)
              ? parsed
              : null;

          if (!incoming) throw new Error("Invalid file");

          const normalized = incoming.map(normalizeProject).filter((project) => project.name);
          state.projects = normalized;
          state.selectedId = normalized[0]?.id || null;
          state.appSettings = normalizeAppSettings(parsed.appSettings);
          state.workspace = state.selectedId ? "project" : "table";
          persist("Imported");
        } catch (error) {
          showStorageError("Import failed. Use a JSON export created by this dashboard.");
        } finally {
          els.importFile.value = "";
        }
      };

      const setupResizeRail = () => {
        if (!els.resizeRail) return;

        let startX = 0;
        let startWidth = sidebarDefault;
        let lastTapTime = 0;
        let pointerMoved = false;

        const getCurrentWidth = () => {
          const computed = getComputedStyle(document.documentElement).getPropertyValue("--project-sidebar-width");
          return clampSidebarWidth(computed);
        };

        const onPointerMove = (event) => {
          const delta = event.clientX - startX;
          if (Math.abs(delta) > 4) pointerMoved = true;
          setSidebarWidth(startWidth + delta);
        };

        const stopResize = () => {
          document.body.classList.remove("is-resizing");
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerup", stopResize);
          window.removeEventListener("pointercancel", stopResize);
        };

        els.resizeRail.addEventListener("pointerdown", (event) => {
          if (window.matchMedia("(max-width: 980px)").matches) return;

          const nowTime = Date.now();
          const isDoubleTap = nowTime - lastTapTime < 320;
          lastTapTime = nowTime;

          if (isDoubleTap) {
            event.preventDefault();
            toggleSidebarCollapsed();
            return;
          }

          pointerMoved = false;
          startX = event.clientX;
          startWidth = getCurrentWidth();
          document.body.classList.add("is-resizing");
          els.resizeRail.setPointerCapture?.(event.pointerId);
          window.addEventListener("pointermove", onPointerMove);
          window.addEventListener("pointerup", stopResize, { once: true });
          window.addEventListener("pointercancel", stopResize, { once: true });
        });

        els.resizeRail.addEventListener("dblclick", (event) => {
          event.preventDefault();
          toggleSidebarCollapsed();
        });

        els.resizeRail.addEventListener("keydown", (event) => {
          const current = getCurrentWidth();
          const step = event.shiftKey ? 40 : 16;

          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleSidebarCollapsed();
          }

          if (event.key === "ArrowLeft") {
            event.preventDefault();
            setSidebarWidth(current - step);
          }

          if (event.key === "ArrowRight") {
            event.preventDefault();
            setSidebarWidth(current + step);
          }

          if (event.key === "Home") {
            event.preventDefault();
            setSidebarWidth(sidebarMin);
          }

          if (event.key === "End") {
            event.preventDefault();
            setSidebarWidth(sidebarMax);
          }
        });
      };

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action], [data-project-id]");
        if (!target) return;

        const action = target.dataset.action;

        if (target.classList.contains("project-row")) {
          state.selectedId = target.dataset.projectId;
          state.workspace = "project";
          state.emojiPickerProjectId = null;
          state.emojiPickerProjectId = null;
          state.modulesOpen = false;
          state.saveStatus = "";
          persist("Selected");
          return;
        }

        if (action === "open-project") {
          state.selectedId = target.dataset.projectId;
          state.workspace = "project";
          state.modulesOpen = false;
          state.saveStatus = "";
          persist("Selected");
          return;
        }

        if (action === "toggle-emoji-picker") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          state.emojiPickerProjectId = state.emojiPickerProjectId === project.id ? null : project.id;
          state.emojiSearch = project.name || "";
          renderWorkspace();
          return;
        }

        if (action === "select-project-emoji") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          project.icon = target.dataset.emoji || suggestProjectEmoji(project);
          project.updatedAt = now();
          state.emojiPickerProjectId = null;
          state.emojiSearch = "";
          persist("Project emoji updated");
          return;
        }

        if (action === "open-project-dialog") {
          openProjectDialog();
          return;
        }

        if (action === "clear-filters") {
          state.filter = "all";
          state.search = "";
          els.searchInput.value = "";
          render();
          return;
        }

        if (action === "switch-project-tab") {
          state.projectTab = target.dataset.tab || "overview";
          state.saveStatus = "";
          renderWorkspace();
          return;
        }

        if (action === "open-modules") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          state.modulesOpen = !state.modulesOpen;
          if (state.modulesOpen) {
            state.modulesMode = "list";
            state.modulesPopoverScrollTop = 0;
          }
          renderWorkspace();
          return;
        }

        if (action === "close-modules") {
          state.modulesOpen = false;
          renderWorkspace();
          return;
        }

        if (action === "open-module") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          const moduleId = target.dataset.moduleId;
          if (!project || !project.modules?.[moduleId]?.enabled) return;
          state.projectTab = `module:${moduleId}`;
          state.modulesOpen = false;
          state.workspace = "project";
          renderWorkspace();
          return;
        }

        if (action === "mark-planner-sync") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          project.integrations = normalizeIntegrations(project.integrations);
          project.integrations.planner.lastSync = now();
          project.updatedAt = now();
          persist("Planner sync checked");
          return;
        }

        if (action === "clear-planner-link") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          project.integrations = normalizeIntegrations({});
          project.modules = normalizeModules(project.modules, project.integrations);
          project.modules.planner.enabled = true;
          project.modules.planner.configured = false;
          project.modules.planner.settings = defaultModuleSettings("planner", {}, project.integrations);
          project.updatedAt = now();
          persist("Planner link cleared");
          return;
        }

        if (action === "delete-project") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          const ok = window.confirm(`Delete "${project.name}"? This cannot be undone.`);
          if (!ok) return;

          state.projects = state.projects.filter((item) => item.id !== project.id);
          state.selectedId = state.projects[0]?.id || null;
          state.workspace = state.projects.length ? "project" : "table";
          persist("Project deleted");
          return;
        }

        if (action === "add-standard-phases") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;

          standardPhaseIds.forEach((key) => {
            const alreadyExists = project.phases.some((phase) => phase.key === key || phase.name.toLowerCase() === stageLabels[key].toLowerCase());
            if (!alreadyExists) {
              project.phases.push({
                id: uid(),
                key,
                name: stageLabels[key],
                status: key === project.stage ? "active" : "planned",
                description: "",
                createdAt: now()
              });
            }
          });

          project.updatedAt = now();
          persist("Standard phases added");
          return;
        }

        if (action === "delete-phase") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;

          const phaseId = target.dataset.phaseId;
          const attachedTasks = project.tasks.filter((task) => task.phaseId === phaseId).length;
          const ok = attachedTasks > 0
            ? window.confirm(`Delete this phase and ${attachedTasks} attached task${attachedTasks === 1 ? "" : "s"}?`)
            : window.confirm("Delete this phase?");
          if (!ok) return;

          project.phases = project.phases.filter((phase) => phase.id !== phaseId);
          project.tasks = project.tasks.filter((task) => task.phaseId !== phaseId);
          project.updatedAt = now();
          persist("Phase deleted");
          return;
        }

        if (action === "toggle-task") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          const task = project?.tasks.find((item) => item.id === target.dataset.taskId);
          if (!project || !task) return;
          task.done = target.checked;
          project.updatedAt = now();
          persist(task.done ? "Task completed" : "Task reopened");
          return;
        }

        if (action === "delete-task") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          project.tasks = project.tasks.filter((task) => task.id !== target.dataset.taskId);
          project.updatedAt = now();
          persist("Task deleted");
          return;
        }

        if (action === "delete-note") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          project.notes = project.notes.filter((note) => note.id !== target.dataset.noteId);
          project.updatedAt = now();
          persist("Note deleted");
          return;
        }

        if (action === "export-project") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;
          exportData({ projects: [project], version: 1 }, `${project.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "project"}.json`);
        }
      });

      document.addEventListener("change", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;

        if (target.dataset.action === "change-planner-backend") {
          captureModulesScroll();
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          if (!project) return;

          const form = target.closest("form");
          const formData = form ? new FormData(form) : new FormData();
          project.modules = normalizeModules(project.modules, project.integrations);

          const record = project.modules.planner;
          record.enabled = true;
          record.settings = defaultModuleSettings("planner", {
            ...(record.settings || {}),
            backendSystem: target.value,
            accountType: formData.get("accountType"),
            externalName: formData.get("externalName"),
            externalUrl: formData.get("externalUrl"),
            externalId: formData.get("externalId"),
            syncMode: formData.get("syncMode")
          }, project.integrations);

          syncPlannerIntegrationFromModule(project);
          project.updatedAt = now();
          state.openModuleSettings = "planner";
          persist("Planner backend updated");
          return;
        }

        if (target.dataset.action === "toggle-module") {
          captureModulesScroll();
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          const moduleId = target.dataset.moduleId;
          if (!project || !getModuleDefinitions().some((module) => module.id === moduleId)) return;
          project.modules = normalizeModules(project.modules, project.integrations);
          project.modules[moduleId].enabled = target.checked;
          project.modules[moduleId].configured = false;
          if (!target.checked && state.projectTab === `module:${moduleId}`) {
            state.projectTab = "overview";
          }
          project.updatedAt = now();
          persist(target.checked ? "Module enabled" : "Module disabled");
          return;
        }

        if (target.dataset.action === "change-phase-status") {
          const project = state.projects.find((item) => item.id === target.dataset.projectId);
          const phase = project?.phases.find((item) => item.id === target.dataset.phaseId);
          if (!project || !phase) return;
          phase.status = phaseStatusLabels[target.value] ? target.value : "planned";
          project.updatedAt = now();
          persist("Phase updated");
        }
      });

      document.addEventListener("submit", async (event) => {
        const form = event.target;
        const action = form.dataset.action;

        if (form === els.projectForm) {
          event.preventDefault();
          createProject(new FormData(form));
          return;
        }

        if (action === "edit-project") {
          event.preventDefault();
          const formData = new FormData(form);
          const name = String(formData.get("name") || "").trim();
          if (!name) return;

          updateProject(form.dataset.projectId, {
            name,
            status: formData.get("status"),
            stage: formData.get("stage"),
            goal: String(formData.get("goal") || "").trim(),
            nextAction: String(formData.get("nextAction") || "").trim()
          });
          return;
        }

        if (action === "add-phase") {
          event.preventDefault();
          const project = state.projects.find((item) => item.id === form.dataset.projectId);
          const formData = new FormData(form);
          const name = String(formData.get("name") || "").trim();
          if (!project || !name) return;

          project.phases.push({
            id: uid(),
            key: "",
            name,
            status: phaseStatusLabels[formData.get("status")] ? formData.get("status") : "planned",
            description: "",
            createdAt: now()
          });
          project.updatedAt = now();
          persist("Phase added");
          return;
        }

        if (action === "add-task") {
          event.preventDefault();
          const formData = new FormData(form);
          const title = String(formData.get("title") || "").trim();
          if (!title) return;

          const project = state.projects.find((item) => item.id === form.dataset.projectId);
          if (!project) return;

          const phaseId = form.dataset.phaseId || String(formData.get("phaseId") || "") || project.phases[0]?.id || "";
          if (!phaseId) {
            state.projectTab = "phases";
            renderWorkspace();
            return;
          }

          project.tasks.unshift({ id: uid(), phaseId, title, done: false, createdAt: now() });
          project.updatedAt = now();
          persist("Task added");
          return;
        }

        if (action === "add-note") {
          event.preventDefault();
          const formData = new FormData(form);
          const body = String(formData.get("body") || "").trim();
          if (!body) return;

          const project = state.projects.find((item) => item.id === form.dataset.projectId);
          if (!project) return;

          project.notes.push({ id: uid(), body, createdAt: now() });
          project.updatedAt = now();
          persist("Note added");
        }
      });

      els.filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          render();
        });
      });

      els.searchInput.addEventListener("input", (event) => {
        state.search = event.target.value;
        render();
      });

      document.addEventListener("input", (event) => {
        const target = event.target.closest?.("[data-action='emoji-search']");
        if (!target) return;
        state.emojiSearch = target.value;
        renderWorkspace();
        window.requestAnimationFrame(() => {
          const input = document.querySelector("[data-action='emoji-search']");
          input?.focus();
          if (input) input.selectionStart = input.selectionEnd = input.value.length;
        });
      });

      els.allProjectsButton.addEventListener("click", () => {
        state.workspace = "table";
        state.modulesOpen = false;
        render();
      });

      els.openProjectDialogButton.addEventListener("click", openProjectDialog);
      els.closeDialogButton.addEventListener("click", closeProjectDialog);
      els.cancelProjectButton.addEventListener("click", closeProjectDialog);

      els.newProjectName.addEventListener("input", () => {
        els.createProjectButton.disabled = els.newProjectName.value.trim().length === 0;
      });

      els.exportButton.addEventListener("click", () => {
        exportData({ projects: state.projects, selectedId: state.selectedId, appSettings: state.appSettings, version: 1 }, "ourdashboard-export.json");
      });

      els.importButton.addEventListener("click", () => {
        els.importFile.click();
      });

      els.importFile.addEventListener("change", (event) => {
        handleImport(event.target.files[0]);
      });

      els.projectDialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        closeProjectDialog();
      });

      window.addEventListener("keydown", (event) => {
        const isMac = navigator.platform.toLowerCase().includes("mac");
        const modifier = isMac ? event.metaKey : event.ctrlKey;

        if (modifier && event.key.toLowerCase() === "k") {
          event.preventDefault();
          els.searchInput.focus();
        }

        if (modifier && event.key.toLowerCase() === "n") {
          event.preventDefault();
          openProjectDialog();
        }

        const activeTab = event.target.closest?.(".tab-button");
        if (activeTab && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
          event.preventDefault();
          const tabs = [...document.querySelectorAll(".tab-button")];
          const currentIndex = tabs.indexOf(activeTab);
          const direction = event.key === "ArrowRight" ? 1 : -1;
          const nextIndex = (currentIndex + direction + tabs.length) % tabs.length;
          tabs[nextIndex].click();
          tabs[nextIndex].focus();
        }
      });

      loadState();
      loadLayout();
      setupResizeRail();
      render();
      window.requestAnimationFrame(() => {
        els.html.setAttribute("data-app-ready", "true");
      });
    })();
  </script>
</body>
</html>
